<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Motor de Chroma</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.4.0/p5.js"></script>
<style>
:root{--bg:#f5f5f5;--glass:rgba(255,255,255,0.9);--txt:#1d1d1f;--txt2:#86868b;--border:rgba(0,0,0,0.08);--accent:#0071e3;--accent2:#0077ed;--sh1:0 1px 4px rgba(0,0,0,0.05);--sh2:0 4px 14px rgba(0,0,0,0.08);--sh3:0 8px 32px rgba(0,0,0,0.14);--r1:8px;--r2:12px;--r3:18px;--ease:all 0.26s cubic-bezier(0.4,0,0.2,1)}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{font-family:-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif;background:var(--bg);color:var(--txt);-webkit-font-smoothing:antialiased;min-height:100vh}
.page{min-height:100vh;padding:32px 0 64px;display:flex;flex-direction:column;align-items:center}
.wrapper{width:74%;max-width:1280px;margin:0 auto;display:flex;flex-direction:column;align-items:stretch}
.top-hint{text-align:center;font-size:11px;color:var(--txt2);letter-spacing:.3px;margin-bottom:14px}
.nav{padding:0;display:flex;align-items:center;gap:14px;background:transparent;margin-bottom:40px;z-index:100;position:relative}
.nav-title{font-size:19px;font-weight:600;letter-spacing:-.4px;white-space:nowrap;margin-right:8px}
.nav-center{display:flex;gap:10px;align-items:center;flex:1;justify-content:center}
.nav-right{display:flex;gap:10px;align-items:center}
.hint{font-size:12px;color:var(--txt2);white-space:nowrap}
.cg{position:relative}
.cb{display:flex;align-items:center;gap:8px;padding:8px 15px;background:var(--glass);backdrop-filter:blur(20px) saturate(180%);border:1px solid var(--border);border-radius:var(--r2);color:var(--txt);font-size:13.5px;font-weight:500;cursor:pointer;transition:var(--ease);box-shadow:var(--sh1);min-width:140px;justify-content:space-between;white-space:nowrap}
.cb:hover{background:rgba(255,255,255,.95);box-shadow:var(--sh2);transform:translateY(-1px)}
.cb:active{transform:translateY(0)}
.cb.pal-on{background:rgba(0,113,227,.08);border-color:rgba(0,113,227,.35);color:var(--accent)}
.cb-arrow{font-size:11px;opacity:.5;transition:var(--ease)}
.cg.open .cb-arrow{transform:rotate(180deg)}
.btn-dl{display:flex;align-items:center;gap:7px;padding:8px 22px;background:var(--accent);border:none;border-radius:var(--r2);color:#fff;font-size:13.5px;font-weight:500;cursor:pointer;transition:var(--ease);box-shadow:var(--sh1)}
.btn-dl:hover{background:var(--accent2);box-shadow:var(--sh2);transform:translateY(-1px)}
.btn-dl:active{transform:translateY(0)}
.dd{position:absolute;top:calc(100% + 8px);left:0;background:rgba(255,255,255,.88);backdrop-filter:blur(28px) saturate(200%);border:1px solid rgba(255,255,255,.7);border-radius:var(--r3);box-shadow:var(--sh3);opacity:0;visibility:hidden;transform:translateY(-6px);transition:var(--ease);z-index:1000;overflow:hidden;display:none}
.cg.open .dd{opacity:1;visibility:visible;transform:translateY(0);display:block}
.dd-head{padding:13px 17px;border-bottom:1px solid rgba(0,0,0,.06);background:rgba(255,255,255,.5);font-size:10.5px;font-weight:600;color:var(--txt2);text-transform:uppercase;letter-spacing:.6px}
.dd-body{overflow-y:auto;padding:6px}
.dd-body::-webkit-scrollbar{width:4px}
.dd-body::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px}
.dd-artists{min-width:268px;max-height:calc(100vh - 120px)}
.dd-artists .dd-body{max-height:calc(100vh - 170px)}
.era-lbl{padding:9px 13px 3px;font-size:9.5px;font-weight:700;color:rgba(0,0,0,.28);text-transform:uppercase;letter-spacing:.8px}
.ai{display:flex;justify-content:space-between;align-items:center;padding:8px 13px;border-radius:var(--r1);cursor:pointer;transition:var(--ease);margin:1px 0}
.ai:hover{background:rgba(0,0,0,.04)}
.ai.sel{background:rgba(0,113,227,.09);color:var(--accent)}
.ai-name{font-size:13.5px;font-weight:500}
.ai-year{font-size:12px;color:var(--txt2)}
.ai.sel .ai-year{color:rgba(0,113,227,.65)}
.dd-palette{min-width:295px}
.pal-body{padding:16px;display:flex;flex-direction:column;gap:12px}
.cr{display:flex;align-items:center;gap:11px}
.cr input[type=color]{width:52px;height:52px;border:1.5px solid var(--border);border-radius:var(--r1);cursor:pointer;background:none;padding:0;transition:var(--ease)}
.cr input[type=color]::-webkit-color-swatch-wrapper{padding:0}
.cr input[type=color]::-webkit-color-swatch{border:none;border-radius:6px}
.cr input[type=color]:hover{transform:scale(1.06);box-shadow:var(--sh2)}
.cr label{font-size:13.5px;font-weight:500;flex:1}
.apply-btn{margin:4px 16px 16px;padding:10px;background:var(--accent);color:#fff;border:none;border-radius:var(--r2);font-size:14px;font-weight:500;cursor:pointer;transition:var(--ease);width:calc(100% - 32px)}
.apply-btn:hover{background:var(--accent2);transform:translateY(-1px)}
.dd-settings{min-width:285px}
.set-body{padding:16px;display:flex;flex-direction:column;gap:18px}
.sl-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;font-size:13.5px;font-weight:500}
.sl-val{font-size:12px;color:var(--txt2);font-variant-numeric:tabular-nums}
input[type=range]{width:100%;height:4px;border-radius:2px;background:var(--border);outline:none;-webkit-appearance:none;cursor:pointer}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:18px;height:18px;border-radius:50%;background:var(--accent);cursor:pointer;box-shadow:0 2px 4px rgba(0,0,0,.2);transition:var(--ease)}
input[type=range]::-moz-range-thumb{width:18px;height:18px;border-radius:50%;background:var(--accent);cursor:pointer;border:none}
.tg-row{display:flex;justify-content:space-between;align-items:center;font-size:13.5px;font-weight:500;cursor:pointer}
.tg{position:relative;width:44px;height:26px;flex-shrink:0}
.tg input{opacity:0;width:0;height:0}
.tg-t{position:absolute;cursor:pointer;inset:0;background:#ccc;transition:var(--ease);border-radius:26px}
.tg-t:before{position:absolute;content:"";height:20px;width:20px;left:3px;bottom:3px;background:#fff;transition:var(--ease);border-radius:50%;box-shadow:0 2px 4px rgba(0,0,0,.2)}
.tg input:checked+.tg-t{background:var(--accent)}
.tg input:checked+.tg-t:before{transform:translateX(18px)}
.canvas-frame{background:#fff;border-radius:24px;padding:20px;box-shadow:0 2px 12px rgba(0,0,0,0.04),0 0 0 1px rgba(0,0,0,0.03);align-self:center;max-width:100%}
#canvas-container{aspect-ratio:1.35/1;width:min(calc(74vw - 40px),calc((100vh - 240px) * 1.35));max-height:calc(100vh - 240px);border-radius:12px;overflow:hidden;background:#fff;position:relative}
#canvas-container canvas{display:block;width:100%!important;height:100%!important;position:absolute;inset:0}
.overlay{position:fixed;inset:0;z-index:998;display:none;background:rgba(0,0,0,.2);backdrop-filter:blur(3px)}
.overlay.on{display:block}
@media(max-width:1100px){.wrapper{width:84%}#canvas-container{width:min(calc(84vw - 40px),calc((100vh - 240px) * 1.35))}}
@media(max-width:860px){.hint{display:none}.wrapper{width:92%}.nav{margin-bottom:24px;gap:8px;flex-wrap:wrap}.canvas-frame{padding:14px;border-radius:18px}#canvas-container{width:min(calc(92vw - 28px),calc((100vh - 220px) * 1.35));max-height:calc(100vh - 220px);border-radius:10px}.page{padding:20px 0 48px}}
@media(max-width:640px){.nav-center{order:3;width:100%;overflow-x:auto;padding-bottom:4px}.cb{min-width:auto;font-size:13px;padding:7px 12px}.dd{position:fixed!important;left:0!important;right:0!important;top:auto!important;bottom:0!important;min-width:auto!important;width:100%!important;border-radius:var(--r3) var(--r3) 0 0!important;max-height:72vh!important;transform:translateY(100%)!important}.cg.open .dd{transform:translateY(0)!important}}
</style>
</head>
<body>
<div class="overlay" id="overlay"></div>
<div class="page">
<div class="wrapper">
<div class="top-hint">Haz clic en el canvas para generar una nueva obra</div>
<nav class="nav">
  <h1 class="nav-title">Motor de Chroma</h1>
  <div class="nav-center">
    <div class="cg" id="cg-a">
      <button class="cb" id="btn-a"><span id="txt-a">Paleta de Artista</span><span class="cb-arrow">⌄</span></button>
      <div class="dd dd-artists" id="dd-a">
        <div class="dd-head">Seleccionar Artista</div>
        <div class="dd-body" id="artist-list"></div>
      </div>
    </div>
    <div class="cg" id="cg-p">
      <button class="cb" id="btn-p"><span>Paleta Personalizada</span><span class="cb-arrow">⌄</span></button>
      <div class="dd dd-palette" id="dd-p">
        <div class="dd-head">Crear tu paleta</div>
        <div class="pal-body">
          <div class="cr"><input type="color" id="c1" value="#E63946"><label for="c1">Color 1</label></div>
          <div class="cr"><input type="color" id="c2" value="#457B9D"><label for="c2">Color 2</label></div>
          <div class="cr"><input type="color" id="c3" value="#F4A261"><label for="c3">Color 3</label></div>
          <div class="cr"><input type="color" id="c4" value="#2A9D8F"><label for="c4">Color 4</label></div>
          <div class="cr"><input type="color" id="c5" value="#E9C46A"><label for="c5">Color 5</label></div>
        </div>
        <button class="apply-btn" id="btn-apply">Aplicar paleta</button>
      </div>
    </div>
    <div class="cg" id="cg-s">
      <button class="cb" id="btn-s"><span>Configuración</span><span class="cb-arrow">⌄</span></button>
      <div class="dd dd-settings" id="dd-s">
        <div class="dd-head">Ajustes del canvas</div>
        <div class="set-body">
          <div><div class="sl-row"><span>Capas</span><span class="sl-val" id="vl">10</span></div><input type="range" id="sl-l" min="1" max="20" value="10"></div>
          <div><div class="sl-row"><span>Rotación</span><span class="sl-val" id="vr">1°</span></div><input type="range" id="sl-r" min="0" max="360" value="1"></div>
          <div><div class="sl-row"><span>Grosor</span><span class="sl-val" id="vs">0.05</span></div><input type="range" id="sl-s" min="0.05" max="4" step="0.05" value="0.05"></div>
          <div><div class="sl-row"><span>Opacidad</span><span class="sl-val" id="va">255</span></div><input type="range" id="sl-a" min="30" max="255" value="255"></div>
          <label class="tg-row"><span>Mostrar líneas</span><div class="tg"><input type="checkbox" id="tog-l" checked><span class="tg-t"></span></div></label>
          <label class="tg-row"><span>Rellenar formas</span><div class="tg"><input type="checkbox" id="tog-f" checked><span class="tg-t"></span></div></label>
          <label class="tg-row"><span>Líneas de color</span><div class="tg"><input type="checkbox" id="tog-c"><span class="tg-t"></span></div></label>
        </div>
      </div>
    </div>
  </div>
  <div class="nav-right">
    <button class="btn-dl" id="btn-dl">↓ Descargar</button>
  </div>
</nav>
<div class="canvas-frame"><div id="canvas-container"></div></div>
</div>
</div>

let layers=10,rotStripe=1,showLines=true,alph=255,filling=true,colorLines=false,sw=0.05;
let artistPalette=[],userPalette=[],userOn=false,currentKey="okeeffe",currentArtistName="Georgia O'Keeffe";

function getCanvasSize(){
  const c=document.getElementById('canvas-container');
  const r=c.getBoundingClientRect();
  return {w:Math.max(100,Math.round(r.width)),h:Math.max(100,Math.round(r.height))};
}

function setup(){
  const s=getCanvasSize();
  createCanvas(s.w,s.h).parent('canvas-container');
  noLoop();
  setArtist("okeeffe");
  drawArt();
  requestAnimationFrame(()=>{
    const s2=getCanvasSize();
    if(s2.w!==s.w||s2.h!==s.h){resizeCanvas(s2.w,s2.h);drawArt();}
  });
  if(window.ResizeObserver){
    const ro=new ResizeObserver(()=>{
      const s3=getCanvasSize();
      if(Math.abs(s3.w-width)>2||Math.abs(s3.h-height)>2){resizeCanvas(s3.w,s3.h);drawArt();}
    });
    ro.observe(document.getElementById('canvas-container'));
  }
}

function windowResized(){
  const s=getCanvasSize();
  resizeCanvas(s.w,s.h);
  drawArt();
}

function drawArt(){
  background(255);
  if(showLines){stroke(0,0,0,60);strokeWeight(sw);}else{noStroke();}
  angleMode(DEGREES);
  const end=height/2+500;
  for(let i=0;i<layers;i++){
    let y1=(i===0)?-height/2-300:-height/2+(height/layers)*i;
    let y2=y1,y3=y1,y4=y1,y5=y1,y6=y1;
    const rl=random(359);let rt=0;
    while(y1<end&&y2<end&&y3<end&&y4<end&&y5<end&&y6<end){
      y1+=random(0,7);y2+=random(0,7);y3+=random(0,7);
      y4+=random(0,7);y5+=random(0,7);y6+=random(0,7);
      const pal=userOn&&userPalette.length?userPalette:artistPalette;
      const col=pal[floor(random(pal.length))];
      if(filling)fill(col[0],col[1],col[2],alph);else noFill();
      if(colorLines)stroke(col[0],col[1],col[2],alph);
      push();translate(width/2,height/2);rt+=rotStripe;rotate(rt+rl);
      const xs=-width/2;
      beginShape();
      curveVertex(xs-300,height/2+500);curveVertex(xs-300,y1);
      curveVertex(xs+(width/5)*1,y2);curveVertex(xs+(width/5)*2,y3);
      curveVertex(xs+(width/5)*3,y4);curveVertex(xs+(width/5)*4,y5);
      curveVertex(width/2+300,y6);curveVertex(width/2+300,height/2+500);
      endShape(CLOSE);pop();
    }
  }
}

function mousePressed(){if(mouseX>=0&&mouseX<=width&&mouseY>=0&&mouseY<=height)drawArt();}
function keyTyped(){if(key==='s')saveCanvas(downloadName(),'jpg');}

function setArtist(key){
  for(const e of ERAS){const a=e.artists.find(x=>x.key===key);if(a){artistPalette=a.colors;currentKey=key;currentArtistName=a.name;return a;}}
}

function downloadName(){
  return 'Motor de Chroma - '+(userOn?'Paleta Personalizada':currentArtistName);
}

function buildList(){
  const el=document.getElementById('artist-list');
  ERAS.forEach(e=>{
    const lbl=document.createElement('div');lbl.className='era-lbl';lbl.textContent=e.era;el.appendChild(lbl);
    e.artists.forEach(a=>{
      const d=document.createElement('div');d.className='ai';d.dataset.key=a.key;
      d.innerHTML=`<span class="ai-name">${a.name}</span><span class="ai-year">${a.year}</span>`;
      if(a.key===currentKey)d.classList.add('sel');
      d.addEventListener('click',()=>{
        document.querySelectorAll('.ai').forEach(x=>x.classList.remove('sel'));
        d.classList.add('sel');
        document.getElementById('txt-a').textContent=a.name;
        document.getElementById('btn-p').classList.remove('pal-on');
        userOn=false;setArtist(a.key);drawArt();closeAll();
      });
      el.appendChild(d);
    });
  });
}

function closeAll(){
  document.querySelectorAll('.cg').forEach(g=>g.classList.remove('open'));
  document.getElementById('overlay').classList.remove('on');
}
function tog(id){
  const g=document.getElementById(id);const was=g.classList.contains('open');
  closeAll();if(!was){g.classList.add('open');if(window.innerWidth<=640)document.getElementById('overlay').classList.add('on');}
}
function hex2rgb(h){return[parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16)];}

function initUI(){
  buildList();
  document.getElementById('btn-a').addEventListener('click',e=>{e.stopPropagation();tog('cg-a');});
  document.getElementById('btn-p').addEventListener('click',e=>{e.stopPropagation();tog('cg-p');});
  document.getElementById('btn-s').addEventListener('click',e=>{e.stopPropagation();tog('cg-s');});
  document.addEventListener('click',e=>{if(!e.target.closest('.cg')||e.target.id==='overlay')closeAll();});
  document.getElementById('overlay').addEventListener('click',closeAll);
  document.getElementById('btn-apply').addEventListener('click',e=>{
    e.stopPropagation();
    userPalette=['c1','c2','c3','c4','c5'].map(id=>hex2rgb(document.getElementById(id).value));
    userOn=true;document.getElementById('btn-p').classList.add('pal-on');
    document.querySelectorAll('.ai').forEach(x=>x.classList.remove('sel'));
    document.getElementById('txt-a').textContent='Paleta personalizada';
    drawArt();closeAll();
  });
  const bindSl=(id,vid,sfx,cb)=>{
    const s=document.getElementById(id),o=document.getElementById(vid);
    s.addEventListener('input',()=>{o.textContent=s.value+(sfx||'');cb(s.value);});
  };
  bindSl('sl-l','vl','',v=>{layers=parseInt(v);drawArt();});
  bindSl('sl-r','vr','°',v=>{rotStripe=parseInt(v);drawArt();});
  bindSl('sl-s','vs','',v=>{sw=parseFloat(v);drawArt();});
  bindSl('sl-a','va','',v=>{alph=parseInt(v);drawArt();});
  const bindTog=(id,cb)=>document.getElementById(id).addEventListener('change',e=>cb(e.target.checked));
  bindTog('tog-l',v=>{showLines=v;drawArt();});
  bindTog('tog-f',v=>{filling=v;drawArt();});
  bindTog('tog-c',v=>{colorLines=v;drawArt();});
  document.getElementById('btn-dl').addEventListener('click',e=>{
    e.stopPropagation();saveCanvas(downloadName(),'png');
  });
  document.getElementById('txt-a').textContent="Georgia O'Keeffe";
}

window.addEventListener('load',()=>{setTimeout(initUI,800);});
</script>
