<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <title>Anatomía de la distancia — Fase 1</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!--
      Anatomía de la distancia
      ------------------------
      Obra de arte generativo construida por fases con p5.js.
      Fase 1: lienzo WEBGL a pantalla completa, fondo negro puro,
      dos cuerpos elípticos enfrentados que giran lentamente
      alrededor del centro. Los contornos se dibujan en blanco
      muy fino solo como ayuda visual durante el desarrollo.
    -->

    <style>
      /* Reseteamos márgenes para que el canvas ocupe toda la pantalla
         y no aparezcan barras de desplazamiento. */
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        background: #000;
        overflow: hidden;
      }

      /* El canvas que crea p5.js queda como bloque, sin espacio extra. */
      canvas {
        display: block;
      }
    </style>

    <!-- Librería p5.js cargada desde un CDN oficial. -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.4/p5.min.js"></script>
  </head>

  <body>
    <!-- Sketch principal de la Fase 1. -->
    <script src="sketch.js"></script>
  </body>
</html>
