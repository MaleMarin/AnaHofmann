<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ana Hofmann — Arte generativo</title>
<style>
:root{--bg:#0a0a0b;--surface:#141416;--border:#2a2a2e;--txt:#e8e8ea;--txt2:#6b6b70;--accent:#7eb8ff;--accent-dim:rgba(126,184,255,0.12)}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{font-family:"SF Mono","Fira Code","Cascadia Code","Consolas",monospace;background:var(--bg);color:var(--txt);min-height:100vh;line-height:1.6;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
.wrap{max-width:880px;margin:0 auto;padding:48px 24px 80px}
header{margin-bottom:56px}
.eyebrow{font-size:11px;color:var(--txt2);letter-spacing:.12em;text-transform:uppercase;margin-bottom:12px}
h1{font-size:clamp(1.5rem,4vw,2rem);font-weight:500;letter-spacing:-.02em;margin-bottom:8px}
.subtitle{font-size:13px;color:var(--txt2);max-width:42ch}
.section-label{font-size:11px;color:var(--txt2);letter-spacing:.1em;text-transform:uppercase;margin-bottom:20px;padding-bottom:8px;border-bottom:1px solid var(--border)}
.grid{display:grid;gap:16px}
@media(min-width:560px){.grid{grid-template-columns:repeat(2,1fr)}}
.card{display:block;background:var(--surface);border:1px solid var(--border);border-radius:6px;padding:20px 22px;transition:border-color .2s ease,background .2s ease,transform .2s ease}
.card:hover{border-color:#3d3d42;background:#1a1a1d;transform:translateY(-2px)}
.card-tag{font-size:10px;color:var(--accent);background:var(--accent-dim);display:inline-block;padding:3px 8px;border-radius:3px;margin-bottom:12px;letter-spacing:.06em}
.card-title{font-size:15px;font-weight:500;margin-bottom:6px}
.card-desc{font-size:12px;color:var(--txt2);line-height:1.55;margin-bottom:14px}
.card-link{font-size:11px;color:var(--accent)}
.card-link::after{content:" →";opacity:.7}
footer{margin-top:64px;padding-top:24px;border-top:1px solid var(--border);font-size:11px;color:var(--txt2)}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <p class="eyebrow">// portfolio</p>
    <h1>Ana Hofmann</h1>
    <p class="subtitle">Proyectos de arte generativo. Exploraciones visuales con código, color y composición.</p>
  </header>

  <section>
    <p class="section-label">proyectos</p>
    <div class="grid">
      <a class="card" href="/apps/motor-de-chroma/">
        <span class="card-tag">p5.js</span>
        <h2 class="card-title">Motor de Chroma</h2>
        <p class="card-desc">Generador de composiciones con capas, rotación y paletas inspiradas en artistas históricos.</p>
        <span class="card-link">abrir app</span>
      </a>
    </div>
  </section>

  <footer>
    <p>© 2026 Ana Hofmann — arte generativo</p>
  </footer>
</div>
</body>
</html>
