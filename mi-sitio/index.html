<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ana hofmann — código · fotografía · video</title>
<meta name="description" content="ana hofmann — código · fotografía · video. Sitio personal de arte.">
<meta name="author" content="ana hofmann">

<meta property="og:type" content="website">
<meta property="og:site_name" content="ana hofmann">
<meta property="og:title" content="ana hofmann — código · fotografía · video">
<meta property="og:description" content="ana hofmann — código · fotografía · video. Sitio personal de arte.">
<meta property="og:locale" content="es_ES">

<meta name="twitter:card" content="summary">
<meta name="twitter:title" content="ana hofmann — código · fotografía · video">
<meta name="twitter:description" content="ana hofmann — código · fotografía · video. Sitio personal de arte.">

<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
html,body{min-height:100%}
body{
  background:#101216;
  color:#e8e4dc;
  font-family:'Space Grotesk',sans-serif;
  -webkit-font-smoothing:antialiased;
}
a{color:inherit;text-decoration:none}

.site{
  width:100%;
  max-width:1100px;
  margin:0 auto;
  padding:56px 72px 80px;
  min-height:100vh;
  display:flex;
  flex-direction:column;
}

.top-bar{
  display:flex;
  justify-content:flex-end;
  align-items:flex-start;
  margin-bottom:auto;
}
.nav-sections{
  display:flex;
  gap:8px;
  align-items:baseline;
  font-size:11px;
  letter-spacing:.14em;
  text-transform:lowercase;
}
.nav-sections a{
  color:rgba(232,228,220,0.35);
  transition:color .25s ease;
}
.nav-sections a:hover{color:#e8e4dc}
.nav-sep{
  color:rgba(232,228,220,0.18);
  pointer-events:none;
  user-select:none;
}

.hero{
  padding:48px 0 72px;
}
.hero-name{
  font-size:clamp(52px,8vw,88px);
  font-weight:300;
  color:#e8e4dc;
  letter-spacing:-2px;
  line-height:1;
}
.hero-name em{
  font-style:normal;
  color:rgba(232,228,220,0.20);
}

.sections{flex:1}
.section{
  padding:40px 0 8px;
  border-top:1px solid rgba(255,255,255,0.06);
}

.projects{
  display:flex;
  gap:0;
}
.proj{
  flex:1;
  padding:28px 32px 0 32px;
  border-right:1px solid rgba(255,255,255,0.06);
  position:relative;
  transition:all .3s ease;
}
.proj:first-child{padding-left:0}
.proj:last-child{border-right:none;padding-right:0}
.proj-name{
  font-size:14px;
  font-weight:400;
  color:rgba(232,228,220,0.42);
  letter-spacing:.03em;
  transition:color .3s;
}
.proj:hover .proj-name{color:#e8e4dc}
.proj-arrow{
  position:absolute;
  right:32px;top:28px;
  font-size:13px;
  color:rgba(232,228,220,0.08);
  transition:all .3s;
}
.proj:last-child .proj-arrow{right:0}
.proj:hover .proj-arrow{
  color:rgba(232,228,220,0.4);
  transform:translate(3px,-3px);
}

.photo-grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:12px;
}
.photo-item{
  aspect-ratio:4/5;
  overflow:hidden;
  background:rgba(255,255,255,0.03);
}
.photo-item img{
  width:100%;
  height:100%;
  object-fit:cover;
  display:block;
}

.video-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
}
.video-item{
  aspect-ratio:16/9;
  overflow:hidden;
  background:rgba(255,255,255,0.03);
}
.video-item video,
.video-item iframe{
  width:100%;
  height:100%;
  border:0;
  display:block;
}

.footer{
  margin-top:96px;
  padding-top:28px;
  border-top:1px solid rgba(255,255,255,0.06);
  display:flex;
  justify-content:space-between;
  align-items:flex-end;
}
.footer-id{
  font-size:11px;
  letter-spacing:.14em;
  color:rgba(232,228,220,0.28);
  text-transform:lowercase;
}
.year{
  font-size:10px;
  color:rgba(232,228,220,0.13);
  letter-spacing:.1em;
}

@media(max-width:720px){
  .site{padding:36px 28px 64px}
  .hero{padding:32px 0 48px}
  .projects{flex-direction:column}
  .proj,.proj:first-child,.proj:last-child{
    border-right:none;
    border-bottom:1px solid rgba(255,255,255,0.06);
    padding:24px 0;
  }
  .proj:last-child{border-bottom:none}
  .proj-arrow{right:0;top:24px}
  .photo-grid{grid-template-columns:1fr 1fr}
  .video-grid{grid-template-columns:1fr}
}
</style>
</head>
<body>
<div class="site">

  <section class="hero" aria-label="identidad">
    <h1 class="hero-name">Ana<br><em>Hofmann</em></h1>
  </section>

  <!-- Secciones renderizadas solo si tienen contenido (ver SITE_CONTENT abajo). -->
  <div class="sections" id="sections"></div>

  <footer class="footer">
    <div class="footer-id">ana hofmann</div>
    <div class="year">2026</div>
  </footer>

</div>

<script>
/*
 * Contenido del sitio. Agregar ítems a fotografia[] o video[]
 * hace que esa sección aparezca sola en el home.
 * Dejar el array vacío = la sección no se renderiza.
 */
const SITE_CONTENT = {
  codigo: [
    { name: "Cromagénesis", href: "/apps/cromagenesis/" },
    { name: "Libélulas Vectoriales", href: "/apps/libelulas/" },
    { name: "Anatomía de la Distancia", href: "/apps/fibras/" },
  ],
  fotografia: [
    // { src: "/fotos/ejemplo.jpg", alt: "descripción" },
  ],
  video: [
    // { src: "/videos/ejemplo.mp4" },
    // { embed: "https://..." },
  ],
};

function escapeHtml(str) {
  return String(str)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;");
}

function renderCodigo(items) {
  const links = items.map((item) => (
    `<a class="proj" href="${escapeHtml(item.href)}">` +
    `<div class="proj-name">${escapeHtml(item.name)}</div>` +
    `<div class="proj-arrow">↗</div>` +
    `</a>`
  )).join("");
  return (
    `<section class="section" id="codigo">` +
    `<div class="projects">${links}</div>` +
    `</section>`
  );
}

function renderFotografia(items) {
  const cells = items.map((item) => (
    `<figure class="photo-item">` +
    `<img src="${escapeHtml(item.src)}" alt="${escapeHtml(item.alt || "")}" loading="lazy">` +
    `</figure>`
  )).join("");
  return (
    `<section class="section" id="fotografia">` +
    `<div class="photo-grid">${cells}</div>` +
    `</section>`
  );
}

function renderVideo(items) {
  const cells = items.map((item) => {
    if (item.embed) {
      return (
        `<div class="video-item">` +
        `<iframe src="${escapeHtml(item.embed)}" allowfullscreen loading="lazy"></iframe>` +
        `</div>`
      );
    }
    return (
      `<div class="video-item">` +
      `<video src="${escapeHtml(item.src)}" controls playsinline></video>` +
      `</div>`
    );
  }).join("");
  return (
    `<section class="section" id="video">` +
    `<div class="video-grid">${cells}</div>` +
    `</section>`
  );
}

function renderHome() {
  const root = document.getElementById("sections");
  const parts = [];

  if (SITE_CONTENT.codigo.length) {
    parts.push(renderCodigo(SITE_CONTENT.codigo));
  }
  if (SITE_CONTENT.fotografia.length) {
    parts.push(renderFotografia(SITE_CONTENT.fotografia));
  }
  if (SITE_CONTENT.video.length) {
    parts.push(renderVideo(SITE_CONTENT.video));
  }

  root.innerHTML = parts.join("");
}

renderHome();
</script>
<script src="/site-nav.js"></script>
</body>
</html>
