<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ana Hofmann</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  background:#101216;
  font-family:'Space Grotesk',sans-serif;
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
}
.pf{
  width:100%;
  max-width:1100px;
  min-height:100vh;
  display:flex;
  flex-direction:column;
  justify-content:space-between;
  padding:56px 72px;
  position:relative;
}
.line-top{
  position:absolute;top:0;left:72px;right:72px;
  height:1px;
  background:linear-gradient(90deg,transparent,rgba(255,255,255,0.07) 30%,rgba(255,255,255,0.07) 70%,transparent);
}
.top-bar{
  display:flex;
  justify-content:space-between;
  align-items:flex-start;
}
.accent-dot{
  width:4px;height:4px;border-radius:50%;
  background:#8ab4c8;
  margin-top:4px;
}
.tag{
  font-size:10px;
  color:rgba(232,228,220,0.18);
  letter-spacing:.25em;
  text-transform:uppercase;
}
.name{
  font-size:clamp(52px,8vw,88px);
  font-weight:300;
  color:#e8e4dc;
  letter-spacing:-2px;
  line-height:1;
  margin-top:auto;
}
.name em{
  font-style:normal;
  color:rgba(232,228,220,0.20);
}
.projects{
  display:flex;
  gap:0;
  margin-top:72px;
  border-top:1px solid rgba(255,255,255,0.06);
}
.proj{
  flex:1;
  padding:28px 32px 0 32px;
  border-right:1px solid rgba(255,255,255,0.06);
  cursor:pointer;
  position:relative;
  text-decoration:none;
  transition:all .3s ease;
}
.proj:first-child{padding-left:0}
.proj:last-child{border-right:none;padding-right:0;}
.proj-name{
  font-size:14px;
  font-weight:400;
  color:rgba(232,228,220,0.42);
  letter-spacing:.03em;
  transition:color .3s;
}
.proj:hover .proj-name{color:#e8e4dc;}
.proj-arrow{
  position:absolute;
  right:32px;top:28px;
  font-size:13px;
  color:rgba(232,228,220,0.08);
  transition:all .3s;
}
.proj:last-child .proj-arrow{right:0}
.proj:hover .proj-arrow{
  color:rgba(232,228,220,0.4);
  transform:translate(3px,-3px);
}
.bottom-bar{
  display:flex;
  justify-content:space-between;
  align-items:flex-end;
  margin-top:56px;
}
.year{
  font-size:10px;
  color:rgba(232,228,220,0.13);
  letter-spacing:.1em;
}
@media(max-width:640px){
  .pf{padding:36px 28px}
  .line-top{left:28px;right:28px}
  .projects{flex-direction:column;gap:0}
  .proj,.proj:first-child{border-right:none;border-bottom:1px solid rgba(255,255,255,0.06);padding:24px 0}
  .proj-arrow{right:0}
}
</style>
</head>
<body>
<div class="pf">
  <div class="line-top"></div>

  <div class="top-bar">
    <div class="accent-dot"></div>
    <div class="tag">Exploraciones</div>
  </div>

  <div>
    <div class="name">Ana<br><em>Hofmann</em></div>

    <div class="projects">
      <a class="proj" href="/apps/motor-de-chroma/">
        <div class="proj-name">Motor de Chroma</div>
        <div class="proj-arrow">↗</div>
      </a>
      <a class="proj" href="/apps/libelulas/">
        <div class="proj-name">Libélulas Vectoriales</div>
        <div class="proj-arrow">↗</div>
      </a>
      <a class="proj" href="/apps/fibras/">
        <div class="proj-name">Anatomía de la Distancia</div>
        <div class="proj-arrow">↗</div>
      </a>
    </div>
  </div>

  <div class="bottom-bar">
    <div class="tag">Exploraciones Generativas</div>
    <div class="year">2026</div>
  </div>
</div>
</body>
</html>
