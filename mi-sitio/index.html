<style>
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
html,body{min-height:100%}
body{
  background:#000;
  color:#e8e4dc;
  font-family:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace;
  -webkit-font-smoothing:antialiased;
}
a{color:inherit;text-decoration:none}

.site{
  width:100%;
  max-width:1100px;
  margin:0 auto;
  padding:56px 72px 80px;
}

/* —— header / hero —— */
.top-bar{
  display:flex;
  justify-content:space-between;
  align-items:flex-start;
  margin-bottom:72px;
}
.nav-sections{
  display:flex;
  gap:28px;
}
.nav-sections a{
  font-size:11px;
  letter-spacing:.14em;
  color:rgba(232,228,220,0.35);
  transition:color .25s ease;
}
.nav-sections a:hover{color:#e8e4dc}

.hero{
  padding:48px 0 96px;
}
.hero-name{
  font-size:clamp(42px,9vw,92px);
  font-weight:400;
  letter-spacing:-0.02em;
  line-height:1.05;
  color:#fff;
  text-transform:lowercase;
}
.hero-desc{
  margin-top:18px;
  font-size:clamp(12px,1.6vw,15px);
  letter-spacing:.18em;
  color:rgba(255,255,255,0.6);
  text-transform:lowercase;
}

/* —— sections —— */
.section{
  padding:64px 0 24px;
  border-top:1px solid rgba(255,255,255,0.06);
}
.section-label{
  font-size:11px;
  letter-spacing:.18em;
  color:rgba(232,228,220,0.45);
  text-transform:lowercase;
  margin-bottom:32px;
}

/* código — lista de piezas */
.projects{
  display:flex;
  gap:0;
}
.proj{
  flex:1;
  padding:8px 32px 8px 0;
  border-right:1px solid rgba(255,255,255,0.06);
  position:relative;
  transition:opacity .25s ease;
}
.proj:last-child{border-right:none;padding-right:0}
.proj-name{
  font-size:14px;
  color:rgba(232,228,220,0.42);
  letter-spacing:.03em;
  transition:color .25s ease;
}
.proj:hover .proj-name{color:#e8e4dc}
.proj-arrow{
  position:absolute;
  right:32px;top:8px;
  font-size:13px;
  color:rgba(232,228,220,0.08);
  transition:all .25s ease;
}
.proj:last-child .proj-arrow{right:0}
.proj:hover .proj-arrow{
  color:rgba(232,228,220,0.4);
  transform:translate(3px,-3px);
}

/* fotografía — grid vacío */
.photo-grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:12px;
}
.photo-slot{
  aspect-ratio:4/5;
  border:1px solid rgba(255,255,255,0.06);
  background:rgba(255,255,255,0.02);
  display:flex;
  align-items:center;
  justify-content:center;
}
.slot-hint{
  font-size:10px;
  letter-spacing:.12em;
  color:rgba(232,228,220,0.18);
  text-transform:lowercase;
}

/* video — placeholder */
.video-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
}
.video-slot{
  aspect-ratio:16/9;
  border:1px solid rgba(255,255,255,0.06);
  background:rgba(255,255,255,0.02);
  display:flex;
  align-items:center;
  justify-content:center;
}

/* —— footer —— */
.footer{
  margin-top:96px;
  padding-top:28px;
  border-top:1px solid rgba(255,255,255,0.06);
  display:flex;
  justify-content:space-between;
  align-items:flex-end;
  gap:24px;
}
.footer-id{
  font-size:11px;
  letter-spacing:.14em;
  color:rgba(232,228,220,0.28);
  text-transform:lowercase;
}
.year{
  font-size:10px;
  color:rgba(232,228,220,0.13);
  letter-spacing:.1em;
}

@media(max-width:720px){
  .site{padding:36px 28px 64px}
  .top-bar{flex-direction:column;gap:20px;margin-bottom:48px}
  .nav-sections{gap:20px}
  .hero{padding:24px 0 64px}
  .projects{flex-direction:column}
  .proj,.proj:last-child{
    border-right:none;
    border-bottom:1px solid rgba(255,255,255,0.06);
    padding:20px 0;
  }
  .proj:last-child{border-bottom:none}
  .proj-arrow{right:0;top:20px}
  .photo-grid{grid-template-columns:1fr 1fr}
  .video-grid{grid-template-columns:1fr}
  .footer{flex-direction:column;align-items:flex-start}
}
