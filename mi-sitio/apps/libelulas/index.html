<!DOCTYPE html>
<html lang="es">
<head>

<title>Libélulas Vectoriales</title>
<style>

canvas{display:block;cursor:crosshair}

.info{position:fixed;bottom:22px;left:22px;color:rgba(220,230,255,0.78);font-size:12.5px;letter-spacing:1px;text-transform:uppercase;pointer-events:none;line-height:1.75;font-weight:500;text-shadow:0 1px 4px rgba(0,0,0,0.7)}
.info span{display:block}

</style>
</head>
<body>
<div class="title">Libélulas Vectoriales</div>
<div class="info">
  <span class="head" style="color:#00f9d4">Libélula 1 · Respira Lento</span>
  <span class="head" style="color:#ff6b35">Libélula 2 · Forma Quieta</span>
  <span class="head" style="color:#b4ff00">Libélula 3 · Latido Rítmico</span>
  <span class="head" style="color:#dc3cff">Libélula 4 · Flujo Continuo</span>
  <span class="sep">─────────────────────</span>
  <span><span class="key">Clic</span>→ Explosión global</span>
  <span><span class="key">1 – 4</span>→ Explotar libélula</span>
  <span><span class="key">F</span>→ Fluir entre libélulas</span>
  <span><span class="key">T</span>→ Transformar todas</span>
  <span><span class="key">G</span>→ Guardar imagen</span>
  <span><span class="key">R</span>→ Reiniciar</span>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.7.0/p5.min.js"></script>
<script>
// ─── PALETAS ────────────────────────────────────────────────────
const PALETTES = {
  d1: { primary:[0,249,212],   secondary:[0,200,255],  accent:[120,255,240], gold:[0,80,180],   extra:[0,255,180] },
  d2: { primary:[255,107,53],  secondary:[255,60,20],  accent:[255,160,80],  gold:[200,40,0],   extra:[255,200,100] },
  d3: { primary:[180,255,0],   secondary:[120,255,50], accent:[220,255,120], gold:[60,180,80],  extra:[255,255,150] },
  d4: { primary:[220,60,255],  secondary:[160,0,255],  accent:[255,100,255], gold:[80,0,200],   extra:[255,180,255] },
};

const BG = [6,13,26];

// ─── FORMA DE LIBÉLULA (puntos paramétricos, con orientación) ─────
// Genera la libélula centrada en (0,0), cabeza apuntando hacia -x,
// luego rota toda la forma por `rot` radianes y la traslada a (cx,cy).
function dragonfly(cx, cy, scale, rot = 0) {
  const local = [];
  const s = scale;

  // === ABDOMEN: largo, delgado y segmentado (tórax → cola) ===
  for (let t = 0; t <= 1; t += 0.010) {
    const bx = -s * 0.04 + t * s * 0.62;
    const seg = sin(t * PI * 9 + 0.2);
    const taper = 1 - t * 0.62;
    const r = s * 0.036 * taper * (0.75 + 0.35 * abs(seg));
    for (let i = 0; i < 5; i++) {
      const a = random(TWO_PI);
      local.push({
        x: bx + random(-r * 0.25, r * 0.25),
        y: cos(a) * r * 0.9 + random(-0.3, 0.3)
      });
    }
  }
  // Cercos terminales (puntita de la cola)
  for (let i = 0; i < 20; i++) {
    local.push({
      x: s * 0.58 + random(-s * 0.015, s * 0.025),
      y: random(-s * 0.012, s * 0.012)
    });
  }

  // === TÓRAX: bloque robusto donde se anclan alas y patas ===
  for (let a = 0; a < TWO_PI; a += 0.07) {
    for (let r = 0; r < s * 0.085; r += s * 0.010) {
      local.push({
        x: -s * 0.13 + cos(a) * r * 0.85,
        y: sin(a) * r * 0.92
      });
    }
  }

  // === CABEZA: redonda, compacta ===
  for (let a = 0; a < TWO_PI; a += 0.10) {
    for (let r = 0; r < s * 0.066; r += s * 0.012) {
      local.push({
        x: -s * 0.30 + cos(a) * r * 0.92,
        y: sin(a) * r * 0.88
      });
    }
  }

  // === OJOS compuestos: grandes, a los lados de la cabeza ===
  for (const ey of [-s * 0.058, s * 0.058]) {
    for (let a = 0; a < TWO_PI; a += 0.11) {
      for (let r = 0; r < s * 0.055; r += s * 0.011) {
        local.push({
          x: -s * 0.34 + cos(a) * r * 0.78,
          y: ey + sin(a) * r
        });
      }
    }
  }

  // === ALAS: 4 alas membranosas perpendiculares al cuerpo ===
  // Par delantero (forewings) y trasero (hindwings) ligeramente desplazados.
  // `idx` se guarda en cada punto del ala para que despues podamos aletear
  // cada ala independientemente (las delanteras y traseras con un pequeño
  // desfase, como en libelulas reales).
  const wingConfigs = [
    { idx: 0, rootX: -0.16, side: -1, length: 0.52, width: 0.13, tilt: -0.20 }, // forewing sup-izq
    { idx: 1, rootX: -0.16, side:  1, length: 0.52, width: 0.13, tilt:  0.20 }, // forewing sup-der
    { idx: 2, rootX: -0.04, side: -1, length: 0.48, width: 0.17, tilt: -0.12 }, // hindwing inf-izq
    { idx: 3, rootX: -0.04, side:  1, length: 0.48, width: 0.17, tilt:  0.12 }, // hindwing inf-der
  ];

  // Helper: agrega un punto con metadata de ala (para aletear despues).
  // `lx`, `ly` son las coordenadas locales del punto **relativas a la raiz
  // del ala** (rootX, 0) y antes de rotar el cuerpo. La rotacion del cuerpo
  // se aplica al final de la funcion, igual que para el resto de puntos.
  const pushWing = (wingCfg, rootX, lx, ly) => {
    local.push({
      x: rootX + lx,
      y: ly,
      wing: { idx: wingCfg.idx, side: wingCfg.side, rootX, lx, ly }
    });
  };

  for (const w of wingConfigs) {
    const rootX = w.rootX * s;
    const wLen = w.length * s;
    const wWid = w.width * s;
    // Eje del ala (perpendicular al cuerpo, ligeramente inclinado por w.tilt)
    const dirX = sin(w.tilt);
    const dirY = cos(w.tilt) * w.side;
    const perpX = cos(w.tilt);
    const perpY = -sin(w.tilt) * w.side;

    // Membrana: relleno con puntos finos, más densos hacia el borde
    for (let i = 0; i < 450; i++) {
      const t = random();
      const u = (random() - 0.5) * 2;
      const shape = sin(t * PI * 0.92 + 0.08);
      const halfW = wWid * 0.5 * shape;
      const along = t * wLen;
      const across = u * halfW;
      const lx = along * dirX + across * perpX;
      const ly = along * dirY + across * perpY;
      const density = 0.10 + abs(u) * 0.55 + (random() < 0.04 ? 0.5 : 0);
      if (random() < density) {
        pushWing(w, rootX, lx, ly);
      }
    }

    // Borde de ataque (frontal, más marcado)
    for (let t = 0; t < 1; t += 0.012) {
      const shape = sin(t * PI * 0.92 + 0.08);
      const halfW = wWid * 0.5 * shape;
      const along = t * wLen;
      pushWing(w, rootX,
        along * dirX + halfW * perpX + random(-0.3, 0.3),
        along * dirY + halfW * perpY + random(-0.3, 0.3));
    }

    // Borde de salida (trasero)
    for (let t = 0; t < 1; t += 0.020) {
      const shape = sin(t * PI * 0.92 + 0.08);
      const halfW = wWid * 0.5 * shape;
      const along = t * wLen;
      pushWing(w, rootX,
        along * dirX - halfW * perpX + random(-0.3, 0.3),
        along * dirY - halfW * perpY + random(-0.3, 0.3));
    }

    // Vena longitudinal central
    for (let t = 0; t < 1; t += 0.025) {
      const along = t * wLen;
      pushWing(w, rootX,
        along * dirX + random(-0.4, 0.4),
        along * dirY + random(-0.4, 0.4));
    }

    // Venas transversales (nervaduras)
    for (let t = 0.12; t < 0.96; t += 0.10) {
      const shape = sin(t * PI * 0.92 + 0.08);
      const halfW = wWid * 0.5 * shape;
      const along = t * wLen;
      for (let u = -1; u <= 1; u += 0.08) {
        if (random() < 0.35) {
          pushWing(w, rootX,
            along * dirX + u * halfW * perpX,
            along * dirY + u * halfW * perpY);
        }
      }
    }
  }

  // === ANTENAS: muy finas, hacia adelante ===
  for (let t = 0; t < 1; t += 0.05) {
    local.push({
      x: -s * (0.38 + t * 0.11) + random(-0.4, 0.4),
      y: -s * 0.014 - t * s * 0.022 + random(-0.4, 0.4)
    });
    local.push({
      x: -s * (0.38 + t * 0.11) + random(-0.4, 0.4),
      y:  s * 0.014 + t * s * 0.022 + random(-0.4, 0.4)
    });
  }

  // === PATAS: 6 finas, salen del tórax hacia abajo y los lados ===
  for (let i = 0; i < 6; i++) {
    const baseX = -s * 0.18 + (i % 3) * s * 0.06;
    const side = i < 3 ? -1 : 1;
    for (let t = 0; t < 1; t += 0.07) {
      local.push({
        x: baseX + t * s * 0.04 + random(-0.4, 0.4),
        y: side * (s * 0.07 + t * s * 0.06) + random(-0.4, 0.4)
      });
    }
  }

  // === ROTAR toda la forma y trasladar a (cx, cy) ===
  // Preservamos p.wing (metadata de ala) sin tocar sus coords locales:
  // el aleteo se aplica despues sobre (wing.lx, wing.ly) y rota el resultado
  // por `df.rot`, asi cada ala se mueve relativa a su raiz pero respetando
  // la orientacion global de la libelula.
  const cr = cos(rot), sr = sin(rot);
  return local.map(p => {
    const out = {
      x: cx + p.x * cr - p.y * sr,
      y: cy + p.x * sr + p.y * cr
    };
    if (p.wing) out.wing = p.wing;
    return out;
  });
}

// ─── VARIABLES GLOBALES ──────────────────────────────────────────
let dragonflies = [];
let isExploding = false;
let explosionForce = 0;
let morphingEnabled = true;
const NUM_PARTICLES = 2800;
// Morph aleatorio sutil (F): cuanto MAS chico, mas dura el viaje entre libelulas.
const MORPHING_SPEED = 0.0011;
// Morph masivo (T): tambien mas lento para que la transformacion sea visible.
const T_MORPH_SPEED = 0.010;
// Amplitud del vuelo orgánico de cada libélula (% del canvas).
// Mas alto = la libelula recorre mas el fondo negro.
const FLIGHT_AMP_X = 0.20;
const FLIGHT_AMP_Y = 0.14;
// Más bajo = vuelo más suave/viscoso y movimientos mas LARGOS y sostenidos.
const FLIGHT_EASE  = 0.012;

// ─── CONFIGURACIÓN DE LAS 4 LIBÉLULAS ───────────────────────────
// rot en radianes: cada una mira hacia una dirección distinta
const CONFIGS = [
  { id:1, palette:'d1', behavior:'organic', pos:{x:0.34, y:0.36}, scale:0.36, rot:  0.55 },  // ↘ diagonal abajo-derecha
  { id:2, palette:'d2', behavior:'static',  pos:{x:0.66, y:0.32}, scale:0.34, rot:  2.40 },  // ↙ diagonal abajo-izquierda
  { id:3, palette:'d3', behavior:'pulse',   pos:{x:0.32, y:0.68}, scale:0.34, rot: -0.70 },  // ↗ diagonal arriba-derecha
  { id:4, palette:'d4', behavior:'flow',    pos:{x:0.68, y:0.66}, scale:0.33, rot: -2.30 },  // ↖ diagonal arriba-izquierda
];

// ─── SETUP ───────────────────────────────────────────────────────
function setup() {
  createCanvas(windowWidth, windowHeight);
  noLoop();
  colorMode(RGB);

  for (const cfg of CONFIGS) {
    const baseCx = width  * cfg.pos.x;
    const baseCy = height * cfg.pos.y;
    const sc = min(width, height) * cfg.scale;
    // Generamos los puntos relativos al centro (cx=cy=0) para poder mover
    // la libelula despues sumando un offset de "vuelo" sin recalcular nada.
    const pts = dragonfly(0, 0, sc, cfg.rot);

    const df = {
      id: cfg.id,
      palette: PALETTES[cfg.palette],
      behavior: cfg.behavior,
      pos: cfg.pos,
      scale: sc,
      rot: cfg.rot,
      baseCx, baseCy,
      cx: baseCx, cy: baseCy,
      flightSeedX: random(10000),
      flightSeedY: random(10000),
      // Conservamos `wing` en cada pixel para que las particulas que
      // caigan sobre el ala lo hereden y puedan aletear despues.
      pixels: pts,
      particles: [],
      time: random(1000),
      pulse: 1,
      // Maniobra activa (CRUISE / HOVER / TURN / REVERSE) y cronometro.
      // Cada libelula entra en maniobras espontaneas: hover, giro de 180
      // o vuelo en reversa, igual que las libelulas reales gracias a sus
      // 4 alas independientes.
      maneuver: { type: 'CRUISE', t: 0, dur: 2 + Math.random() * 3 },
      turnTarget: cfg.rot,
    };

    // Importante: agregamos la libelula al array ANTES de crear sus
    // particulas; en el constructor de Particle se busca su df por id
    // en `dragonflies` y si todavia no esta, la posicion inicial es NaN.
    dragonflies.push(df);

    for (let i = 0; i < NUM_PARTICLES; i++) {
      const rp = random(df.pixels);
      df.particles.push(new Particle(rp.x, rp.y, df, rp.wing || null));
    }
  }

  loop();
}

function windowResized() {
  resizeCanvas(windowWidth, windowHeight);
  // Recolocar las libelulas si se cambia el tamaño de la ventana.
  for (let i = 0; i < dragonflies.length; i++) {
    const cfg = CONFIGS[i];
    if (!cfg) continue;
    dragonflies[i].baseCx = width  * cfg.pos.x;
    dragonflies[i].baseCy = height * cfg.pos.y;
  }
}

// ─── DRAW ────────────────────────────────────────────────────────
function draw() {
  fill(...BG, 18);
  noStroke();
  rect(0, 0, width, height);

  // Grain sutil
  for (let i = 0; i < 300; i++) {
    stroke(200, 220, 255, random(2, 8));
    strokeWeight(random(0.3, 0.8));
    point(random(width), random(height));
  }

  // Actualizamos el centro de cada libélula con un pequeño vuelo orgánico.
  for (const df of dragonflies) {
    // Ciclo temporal lento: el patrón de vuelo evoluciona despacio,
    // tipo planeo de pájaro.
    df.time += 0.006;
    if (df.behavior === 'pulse') {
      // Latido tipo corazon: dos tics rapidos + pausa, no una sinusoide plana.
      const beat = Math.pow(Math.max(0, Math.sin(df.time * 2.6)), 3);
      df.pulse = 1 + beat * 0.34;
    } else if (df.behavior === 'flow') {
      df.pulse = 1 + sin(df.time * 0.55) * 0.09;
    } else if (df.behavior === 'organic') {
      // Respiracion amplia y MUY lenta, casi humana.
      df.pulse = 1 + sin(df.time * 0.9) * 0.12;
    } else df.pulse = 1;

    // ─── MANIOBRAS espontaneas (no se aplican a la estatica) ─────────
    // Cada libelula entra en una maniobra cada cierto tiempo: HOVER
    // (suspendida en el aire), TURN (giro de 180 en pocos aleteos) o
    // REVERSE (vuelo hacia atras). CRUISE es el modo por defecto.
    if (df.behavior !== 'static') {
      df.maneuver.t += 1 / 60;
      if (df.maneuver.t >= df.maneuver.dur) {
        const r = Math.random();
        let next;
        if      (r < 0.14) next = 'HOVER';
        else if (r < 0.24) next = 'TURN';
        else if (r < 0.32) next = 'REVERSE';
        else               next = 'CRUISE';
        const dur = (next === 'CRUISE') ? 5 + Math.random() * 6
                                        : 2.5 + Math.random() * 2.5;
        df.maneuver = { type: next, t: 0, dur };
        if (next === 'TURN') {
          // ~180 grados en una direccion aleatoria.
          df.turnTarget = df.rot + Math.PI * (Math.random() < 0.5 ? 1 : -1);
        }
      }
      // Suaviza el cambio de rot en TURN (3 aleteos ≈ 0.6s).
      if (df.maneuver.type === 'TURN') {
        df.rot = lerp(df.rot, df.turnTarget, 0.10);
      }
    }

    // Modificadores de vuelo segun la maniobra.
    let ampMul = 1, dirSign = 1;
    if (df.behavior === 'static')            ampMul = 0;    // QUIETA: ni se mueve
    else if (df.maneuver.type === 'HOVER')   ampMul = 0.18; // casi quieta
    else if (df.maneuver.type === 'REVERSE') dirSign = -1;  // vuela al opuesto
    else if (df.maneuver.type === 'TURN')    ampMul = 0.55; // se acomoda

    // Vuelo armónico: una capa de Perlin muy lento define la trayectoria
    // (amplia, planeada) y una capa media discreta agrega ondulación sutil.
    // Sin sinusoide rápida: el lerp con FLIGHT_EASE bajo hace el resto.
    const slowT = df.time * 0.25;
    const slowX = (noise(df.flightSeedX,        slowT)        - 0.5) * 2;
    const slowY = (noise(df.flightSeedY,        slowT + 100)  - 0.5) * 2;

    const midT  = df.time * 0.55;
    const midX  = (noise(df.flightSeedX + 500,  midT)         - 0.5) * 0.35;
    const midY  = (noise(df.flightSeedY + 500,  midT + 100)   - 0.5) * 0.35;

    const targetX = df.baseCx + dirSign * (slowX + midX) * width  * FLIGHT_AMP_X * ampMul;
    const targetY = df.baseCy + dirSign * (slowY + midY) * height * FLIGHT_AMP_Y * ampMul;

    df.cx = lerp(df.cx, targetX, FLIGHT_EASE);
    df.cy = lerp(df.cy, targetY, FLIGHT_EASE);
  }

  for (const df of dragonflies) {
    for (const p of df.particles) {
      p.update(df);
      p.draw(df);
    }
  }

  if (isExploding) {
    // Decaimiento mas lento: la explosion se sostiene mucho mas tiempo.
    explosionForce *= 0.965;
    if (explosionForce < 0.25) { isExploding = false; explosionForce = 0; }
  }
}

// ─── PARTÍCULA ───────────────────────────────────────────────────
// Parametros de aleteo por behavior. Cada libelula respeta su leyenda y
// se diferencia claramente de las demas:
//  - organic ("Respira Lento"):   aleteo MUY suave y lento, ligado a la respiracion.
//  - static  ("Forma Quieta"):    SIN aleteo, alas totalmente quietas, no vuela.
//  - pulse   ("Latido Ritmico"):  aleteo en RAFAGAS (latido + pausa), tipo corazon.
//  - flow    ("Flujo Continuo"):  aleteo amplio y constante, las particulas ondulan.
//
// Las 4 alas son INDEPENDIENTES (anatomicamente cada una conecta a un grupo
// muscular distinto en la libelula real). Por defecto las traseras
// (hindwings) van en CONTRAFASE (~PI) respecto a las delanteras, que es el
// patron de vuelo crucero real. En modo HOVER pasan a estar en fase (en
// libelulas reales, asi se quedan suspendidas en el aire).
const FLAP_PARAMS = {
  organic: { freq: 0.07, amp: 0.16 },   // lento y sereno
  static:  { freq: 0.0,  amp: 0.0  },   // sin movimiento
  pulse:   { freq: 0.18, amp: 0.10 },   // rapido + amp se dispara con el latido
  flow:    { freq: 0.11, amp: 0.30 },   // amplio, continuo
};
// Micro-variacion de fase por ala (rompe la simetria perfecta).
const WING_PHASE_JITTER = [0.0, 0.05, Math.PI, Math.PI + 0.06];

class Particle {
  constructor(rx, ry, df, wing) {
    // Coordenadas relativas al centro de la libelula (para que "vuele" entera).
    this.relOx = rx;
    this.relOy = ry;
    this.dfId = df.id;
    // Metadata de ala (null si la particula cayo en el cuerpo, antenas, etc.)
    this.wing = wing || null;
    const startAbs = this.absOrigin();
    this.x  = startAbs.x + randomGaussian(0, 25);
    this.y  = startAbs.y + randomGaussian(0, 25);
    this.tx = startAbs.x; this.ty = startAbs.y;
    this.vx = 0; this.vy = 0;
    this.behavior = df.behavior;
    this.nx = random(1000); this.ny = random(1000);
    this.alpha = random(35, 110);
    this.len   = random(2, 9);
    this.exVx = 0; this.exVy = 0;
    this.exploded = false;
    this.isMorphing = false;
    this.morphProgress = 0;
    this.morphSpeed = MORPHING_SPEED;
    this.morphCommit = false;
    this.morphTargetDf = null;
    // Coords relativas al df objetivo al iniciar el morph.
    this.morphTargetRelX = 0;
    this.morphTargetRelY = 0;
    // Coords absolutas de origen al iniciar el morph (no cambian al moverse el df).
    this.morphSrcDfId = df.id;
    this.morphSrcRelX = rx;
    this.morphSrcRelY = ry;
  }

  ownDf() {
    return dragonflies.find(d => d.id === this.dfId) || dragonflies[0];
  }

  absOrigin() {
    const d = this.ownDf();
    if (this.wing) return this.flapOrigin(d);
    return { x: d.cx + this.relOx, y: d.cy + this.relOy };
  }

  // Origen "vivo" de una particula de ala: la rotamos alrededor de la raiz
  // del ala (rootX, 0) en coords locales del cuerpo, y despues aplicamos
  // la rotacion global del cuerpo (df.rot) y la traslacion al centro vivo.
  // Las 4 alas son independientes (anatomia real): hindwings en contrafase
  // (~PI) con forewings en vuelo crucero; en HOVER pasan a estar en fase
  // (para suspenderse en el aire), y en TURN las alas de un lado del cuerpo
  // aletean con mas amplitud que las del otro (asimetria que hace girar).
  flapOrigin(d) {
    const w = this.wing;
    const params = FLAP_PARAMS[d.behavior] || FLAP_PARAMS.organic;

    let ang = 0;
    if (params.amp > 0) {
      // Fase por ala: en CRUISE/REVERSE/TURN hindwings van en contrafase
      // (PI); en HOVER todas van en fase para mantener altura.
      const inHover = d.maneuver && d.maneuver.type === 'HOVER';
      const hindOffset = inHover ? 0 : Math.PI;
      const isHind = w.idx >= 2;
      const phase = (isHind ? hindOffset : 0) + WING_PHASE_JITTER[w.idx];

      // Amplitud base por behavior (con su modulacion propia).
      let amp = params.amp;
      if (d.behavior === 'pulse') {
        // Aleteo en rafagas, sincronizado con el latido del cuerpo:
        // potencia 3 = pico estrecho + pausa, igual que un corazon.
        const beat = Math.pow(Math.max(0, sin(d.time * 2.6)), 3);
        amp = params.amp + beat * 0.46;
      } else if (d.behavior === 'organic') {
        // Aleteo ligado a la respiracion: crece y decrece con el inhalar/exhalar.
        amp = params.amp * (0.55 + (d.pulse - 1) * 4);
      }

      // Modificadores por maniobra.
      if (d.maneuver) {
        if (d.maneuver.type === 'HOVER') {
          // Mas frecuencia visual y menos amplitud => ala "vibra" para
          // sostener el peso, igual que una libelula al hovering.
          amp *= 0.7;
        } else if (d.maneuver.type === 'TURN') {
          // Asimetria izq/der: el lado +1 aletea fuerte, el -1 mas suave.
          amp *= (w.side > 0) ? 1.35 : 0.55;
        } else if (d.maneuver.type === 'REVERSE') {
          // En reversa la libelula real invierte el angulo de ataque:
          // visualizamos un pequeño desplazamiento de fase.
          amp *= 0.85;
        }
      }

      const freq = (d.maneuver && d.maneuver.type === 'HOVER')
        ? params.freq * 1.4
        : params.freq;

      ang = sin(frameCount * freq + phase) * amp * w.side;
    }

    const cf = Math.cos(ang), sf = Math.sin(ang);
    // Rotar (lx, ly) alrededor de la raiz del ala (que esta en (rootX, 0)
    // en local antes de aplicar la rotacion global del cuerpo).
    const rx = w.lx * cf - w.ly * sf;
    const ry = w.lx * sf + w.ly * cf;
    const localX = w.rootX + rx;
    const localY = ry;
    const cr = Math.cos(d.rot), sr = Math.sin(d.rot);
    return {
      x: d.cx + localX * cr - localY * sr,
      y: d.cy + localX * sr + localY * cr
    };
  }

  startMorph(target, speed, commit) {
    if (!target || !target.pixels.length) return;
    const p = random(target.pixels);
    this.isMorphing = true;
    this.morphProgress = 0;
    this.morphSpeed = speed;
    this.morphCommit = commit;
    this.morphTargetDf = target;
    this.morphTargetRelX = p.x;
    this.morphTargetRelY = p.y;
    this.morphTargetWing = p.wing || null;
    this.morphSrcDfId = this.dfId;
    this.morphSrcRelX = this.relOx;
    this.morphSrcRelY = this.relOy;
  }

  update(df) {
    // Morphing aleatorio sutil (independiente de T).
    if (morphingEnabled && !this.isMorphing && random() < 0.0008) {
      const others = dragonflies.filter(d => d.id !== this.dfId);
      if (others.length) this.startMorph(random(others), MORPHING_SPEED, random() < 0.08);
    }

    // Centro absoluto actual (sigue al vuelo de la libelula y, si la
    // particula esta en un ala, tambien al aleteo).
    const ownDf = this.ownDf();
    const origin = this.absOrigin();

    if (this.isMorphing) {
      this.morphProgress += this.morphSpeed;
      const e = this.morphProgress < 0.5
        ? 4 * pow(this.morphProgress, 3)
        : 1 - pow(-2 * this.morphProgress + 2, 3) / 2;
      // Origen vivo (la libelula de origen tambien se mueve).
      const srcDf = dragonflies.find(d => d.id === this.morphSrcDfId) || ownDf;
      const sx = srcDf.cx + this.morphSrcRelX;
      const sy = srcDf.cy + this.morphSrcRelY;
      const tx = this.morphTargetDf.cx + this.morphTargetRelX;
      const ty = this.morphTargetDf.cy + this.morphTargetRelY;
      this.tx = lerp(sx, tx, e);
      this.ty = lerp(sy, ty, e);
      if (this.morphProgress >= 1) {
        this.isMorphing = false;
        this.morphProgress = 0;
        if (this.morphCommit) {
          this.relOx = this.morphTargetRelX;
          this.relOy = this.morphTargetRelY;
          this.wing = this.morphTargetWing;
          this.behavior = this.morphTargetDf.behavior;
          this.dfId = this.morphTargetDf.id;
        }
      }
    }

    // Target según comportamiento (cuando no esta morphing).
    let targetX = this.tx;
    let targetY = this.ty;

    if (!this.isMorphing) {
      if (this.behavior === 'pulse') {
        const cx = ownDf.cx, cy = ownDf.cy;
        const a  = atan2(origin.y - cy, origin.x - cx);
        const d  = dist(origin.x, origin.y, cx, cy);
        targetX = cx + cos(a) * d * ownDf.pulse;
        targetY = cy + sin(a) * d * ownDf.pulse;
      } else if (this.behavior === 'flow') {
        // Flujo MUY visible: cada particula ondula amplio, como agua en corriente.
        targetX = origin.x + sin(this.nx + frameCount * 0.022) * 22;
        targetY = origin.y + cos(this.ny + frameCount * 0.016) * 17;
      } else if (this.behavior === 'organic') {
        // Respira con todo el cuerpo (oscilacion lenta, amplia y armonica).
        targetX = origin.x + sin(this.nx * 0.4 + frameCount * 0.006) * 8;
        targetY = origin.y + cos(this.ny * 0.4 + frameCount * 0.005) * 7;
      } else {
        // static: target = origen vivo (sigue al vuelo).
        targetX = origin.x;
        targetY = origin.y;
      }
    }

    // La estatica es claramente estatica: alta adherencia al target y nada
    // de ruido. El pulso es nervioso (alta fuerza); el flujo, fluido (media);
    // la organica, suave (baja).
    const force = this.behavior === 'static' ? 0.12
                : this.behavior === 'pulse'  ? 0.055
                : this.behavior === 'flow'   ? 0.038 : 0.024;
    const damp  = this.behavior === 'static' ? 0.82
                : this.behavior === 'pulse'  ? 0.86
                : this.behavior === 'flow'   ? 0.90 : 0.85;

    this.vx += (targetX - this.x) * force;
    this.vy += (targetY - this.y) * force;

    // Estatica: cero ruido. Resto: ruido pequeño solo en cuerpo (no en alas,
    // que ya tienen su propio movimiento) — asi el aleteo se ve "limpio".
    if (this.behavior !== 'static') {
      const ns = this.wing ? 0.0008 : 0.0025;
      this.vx += (noise(this.nx + frameCount * 0.009) - 0.5) * ns * 55;
      this.vy += (noise(this.ny + frameCount * 0.009) - 0.5) * ns * 55;
    }

    // Explosión
    if (isExploding && !this.exploded) {
      const a = atan2(this.y - mouseY, this.x - mouseX);
      const d = dist(this.x, this.y, mouseX, mouseY);
      const f = map(d, 0, 500, explosionForce, explosionForce * 0.35);
      this.exVx = cos(a) * f;
      this.exVy = sin(a) * f;
      this.exploded = true;
    }
    this.vx += this.exVx; this.vy += this.exVy;
    // Inercia mas larga: las particulas se alejan mucho mas antes de volver.
    this.exVx *= 0.955; this.exVy *= 0.955;
    if (!isExploding) this.exploded = false;

    this.vx *= damp; this.vy *= damp;
    this.x  += this.vx; this.y  += this.vy;
  }

  draw(df) {
    let angle = atan2(this.vy, this.vx);
    const md = dist(this.x, this.y, mouseX, mouseY);
    const mi = constrain(map(md, 0, 280, 1, 0), 0, 1);
    angle = lerp(angle, atan2(mouseY - this.y, mouseX - this.x), mi * 0.65);

    const hl = this.len / 2;
    const x1 = this.x - cos(angle) * hl;
    const y1 = this.y - sin(angle) * hl;
    const x2 = this.x + cos(angle) * hl;
    const y2 = this.y + sin(angle) * hl;

    const c = random();
    let col;
    if      (c < 0.07) col = [...df.palette.extra,     this.alpha * 0.55];
    else if (c < 0.18) col = [...df.palette.gold,      this.alpha * 0.65];
    else if (c < 0.38) col = [...df.palette.accent,    this.alpha];
    else if (c < 0.62) col = [...df.palette.secondary, this.alpha * 0.85];
    else               col = [...df.palette.primary,   this.alpha * 0.75];

    stroke(...col);
    strokeWeight(random(0.25, 0.85));
    line(x1, y1, x2, y2);
  }
}

// ─── EVENTOS ─────────────────────────────────────────────────────
function mousePressed() {
  isExploding = true;
  explosionForce = random(55, 85);
}

function keyPressed() {
  // G = Guardar imagen
  if (key === 'g' || key === 'G') saveCanvas('libelulas', 'png');

  // R = Reiniciar
  if (key === 'r' || key === 'R') {
    for (const df of dragonflies) {
      df.particles = [];
      for (let i = 0; i < NUM_PARTICLES; i++) {
        const p = random(df.pixels);
        df.particles.push(new Particle(p.x, p.y, df, p.wing || null));
      }
    }
  }

  if (key >= '1' && key <= '4') {
    const idx = parseInt(key) - 1;
    if (idx < dragonflies.length) {
      for (const p of dragonflies[idx].particles) {
        const a = atan2(p.y - mouseY, p.x - mouseX);
        const d = dist(p.x, p.y, mouseX, mouseY);
        const f = map(d, 0, 500, 80, 20);
        p.exVx = cos(a) * f;
        p.exVy = sin(a) * f;
        p.exploded = true;
      }
    }
  }

  // F = Fluir entre libelulas (toggle del morph aleatorio sutil entre todas)
  if (key === 'f' || key === 'F') morphingEnabled = !morphingEnabled;

  // T = Transformar todas (cada particula salta a otra libelula a alta
  // velocidad y se queda alli, commit = true).
  if (key === 't' || key === 'T') {
    for (const df of dragonflies) {
      for (const p of df.particles) {
        if (!p.isMorphing) {
          const others = dragonflies.filter(d => d.id !== p.dfId);
          if (others.length) {
            p.startMorph(random(others), T_MORPH_SPEED, true);
          }
        }
      }
    }
  }
}
</script>
