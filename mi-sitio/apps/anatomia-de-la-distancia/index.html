<!DOCTYPE html>

<head>

<title>Anatomía de la Distancia — ana hofmann</title>
<style>
  html,body{margin:0;padding:0;width:100%;height:100%;background:#5894e8;overflow:hidden}
  canvas{display:block}
  #audioGate{
    position:fixed; inset:0; z-index:50;
    display:flex; align-items:center; justify-content:center;
    background:rgba(0,0,0,0.55);
    backdrop-filter: blur(6px);
    color:rgba(240,235,228,0.92);
    font-family: monospace;
    font-size: 14px;
    letter-spacing: .22em;
    text-transform: uppercase;
    cursor: pointer;
    user-select: none;
    transition: opacity .6s ease;
  }
  #audioGate .label{
    border:1px solid rgba(255,255,255,0.28);
    border-radius: 999px;
    padding: 14px 26px;
    background: rgba(255,255,255,0.04);
  }
  #audioGate.hidden{ opacity:0; pointer-events:none; }
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.4/p5.min.js"></script>
</head>

color: rgba(240,235,228,0.78);
border: 1px solid rgba(255,255,255,0.18);
border-radius: 999px;
padding: 10px 16px;
font-family: monospace;
font-size: 12px;
