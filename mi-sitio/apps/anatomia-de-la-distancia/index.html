<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Anatomía de la Distancia — ana hofmann</title>
<style>
  html,body{margin:0;padding:0;width:100%;height:100%;background:#0C5F66;overflow:hidden}
  canvas{display:block}
  #audioGate{
    position:fixed; inset:0; z-index:50;
    display:flex; align-items:center; justify-content:center;
    background:rgba(12,95,102,0.62);
    backdrop-filter: blur(6px);
    color:rgba(240,235,228,0.92);
    font-family: monospace;
    font-size: 14px;
    letter-spacing: .22em;
    text-transform: uppercase;
    cursor: pointer;
    user-select: none;
    transition: opacity .6s ease;
  }
  #audioGate .label{
    border:1px solid rgba(255,255,255,0.28);
    border-radius: 999px;
    padding: 14px 26px;
    background: rgba(255,255,255,0.04);
  }
  #audioGate.hidden{ opacity:0; pointer-events:none; }
  #heartDayBadge{
    position:fixed; left:24px; bottom:24px; z-index:60;
    font-family: monospace;
    color: rgba(240,235,228,0.88);
    background: rgba(12,28,48,0.42);
    border: 1px solid rgba(255,255,255,0.14);
    border-radius: 14px;
    padding: 12px 14px 11px;
    backdrop-filter: blur(10px);
    pointer-events: none;
    user-select: none;
    min-width: 168px;
    animation: hdFade 1.15s ease both;
  }
  #heartDayBadge .hd-label{
    font-size: 10px;
    letter-spacing: .14em;
    text-transform: uppercase;
    color: rgba(240,235,228,0.62);
    margin-bottom: 8px;
  }
  #heartDayBadge .hd-row{
    display:flex; align-items:center; gap:8px;
  }
  #heartDayBadge .hd-swatch{
    width: 12px; height: 12px; border-radius: 50%;
    border: 1px solid rgba(255,255,255,0.35);
    box-shadow: 0 0 10px var(--heart-day, rgba(255,255,255,0.35));
    flex-shrink: 0;
  }
  #heartDayBadge .hd-name{
    font-size: 13px;
    letter-spacing: .04em;
    color: rgba(240,235,228,0.94);
  }
  #heartDayBadge .hd-hex{
    margin-top: 4px;
    font-size: 11px;
    letter-spacing: .08em;
    color: rgba(240,235,228,0.55);
  }
  #heartDayBadge .hd-date{
    margin-top: 2px;
    font-size: 10px;
    letter-spacing: .06em;
    color: rgba(240,235,228,0.40);
  }
  #heartDayBadge .hd-note{
    margin-top: 8px;
    font-size: 10px;
    letter-spacing: .02em;
    color: rgba(240,235,228,0.52);
    max-width: 180px;
    line-height: 1.35;
  }
  @keyframes hdFade{
    from{ opacity:0; transform: translateY(8px); }
    to{ opacity:1; transform: translateY(0); }
  }
  @media(max-width:640px){
    #heartDayBadge{ left:12px; bottom:72px; min-width:0; padding:10px 12px; }
  }
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.4/p5.min.js"></script>
</head>
<body>
<div id="audioGate"><span class="label">tocá para iniciar</span></div>
<div id="heartDayBadge" aria-live="polite">
  <div class="hd-label">Color del corazón de hoy</div>
  <div class="hd-row">
    <span class="hd-swatch" id="heartDaySwatch"></span>
    <span class="hd-name" id="heartDayName"></span>
  </div>
  <div class="hd-hex" id="heartDayHex"></div>
  <div class="hd-date" id="heartDayDate"></div>
  <div class="hd-note">El corazón cambia de color cada día.</div>
</div>
<button id="soundToggle" style="
position: fixed;
right: 24px;
bottom: 24px;
z-index: 20;
background: rgba(255,255,255,0.08);
color: rgba(240,235,228,0.78);
border: 1px solid rgba(255,255,255,0.18);
border-radius: 999px;
padding: 10px 16px;
font-family: monospace;
font-size: 12px;
letter-spacing: .16em;
text-transform: uppercase;
backdrop-filter: blur(10px);
cursor: pointer;
display: none;
">
reiniciar
</button>
<script src="/apps/anatomia-de-la-distancia/sketch.js?v=638"></script>
<script src="/site-nav.js?v=3"></script>
</body>
</html>
